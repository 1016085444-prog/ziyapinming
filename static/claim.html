<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>子牙品命 · 领取兑换码</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313110F'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' fill='%23C9A961' text-anchor='middle'%3E%E5%AD%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v=__V__">
<style>
  .claim-wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  .claim-code { font-size: 1.6rem; letter-spacing: .12em; text-align: center; margin: 18px 0; user-select: all; }
  .claim-err { color: #E08A7A; min-height: 1.4em; margin-top: 10px; }
  .claim-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .claim-actions > * { flex: 1 1 200px; text-align: center; }
</style>
</head>
<body>
<main class="claim-wrap">
  <section class="panel">
    <h1 class="big">领取兑换码</h1>
    <p class="lede">输入下单后的订单号，领取你的专属兑换码。同一个订单号再次领取，拿到的还是同一个码。</p>

    <form id="claim-form">
      <label class="field code-field">
        <span class="code-label">订单号 <em>在订单详情里长按复制</em></span>
        <input type="text" id="order-id" name="order_id" autocomplete="off" spellcheck="false"
               inputmode="text" maxlength="64" placeholder="粘贴完整订单号" required>
      </label>
      <button type="submit" class="btn-primary" id="claim-btn">领取兑换码</button>
      <p class="claim-err" id="claim-err" role="alert"></p>
    </form>

    <div id="claim-result" hidden aria-live="polite">
      <p class="lede">你的专属兑换码（一个码只能绑定一个人的出生信息）：</p>
      <p class="claim-code" id="claim-code"></p>
      <div class="claim-actions">
        <a class="btn-primary" id="claim-go" href="/">用这个码开始</a>
        <button type="button" class="btn-outline" id="claim-copy">复制兑换码</button>
      </div>
    </div>
  </section>
</main>

<script>
const form = document.getElementById('claim-form');
const btn = document.getElementById('claim-btn');
const err = document.getElementById('claim-err');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = '领取中…';
  try {
    const res = await fetch('/api/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: document.getElementById('order-id').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '领取失败，请稍后再试');
    document.getElementById('claim-code').textContent = data.code;
    document.getElementById('claim-go').href = '/?code=' + encodeURIComponent(data.code) + '#intake';
    form.hidden = true;
    document.getElementById('claim-result').hidden = false;
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '领取兑换码';
  }
});

document.getElementById('claim-copy').addEventListener('click', async (e) => {
  const code = document.getElementById('claim-code').textContent;
  try { await navigator.clipboard.writeText(code); e.target.textContent = '已复制'; }
  catch { e.target.textContent = '请长按上方兑换码复制'; }
});
</script>
</body>
</html>
